<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>参考素材板</title>
    <style>
      body {
        background: #172c2b;
        color: #d5e2d7;
        font:
          14px "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
        margin: 0;
        padding: 44px;
      }
      h1 {
        font-weight: 450;
        font-size: 30px;
      }
      p {
        color: #98b5aa;
        font-size: 13px;
        line-height: 1.8;
      }
      .tag {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #a4c0a3;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 15px;
        margin-top: 25px;
      }
      .card {
        background: #29413c;
        border: 1px solid #4c6a5e;
        border-radius: 8px;
        padding: 18px;
      }
      .card h3 {
        font-size: 13px;
        font-weight: 500;
        word-break: break-all;
      }
      .card small {
        color: #90ac9d;
      }
      input {
        background: #203833;
        border: 1px solid #58796b;
        color: #d6e7d9;
        padding: 12px;
        border-radius: 5px;
        width: 280px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div class="tag">THIRD-PARTY PAGE / HOST SDK 1</div>
    <h1 id="heading">参考素材板</h1>
    <p>此页面由本地插件加载。素材和时间线仍属于当前项目。</p>
    <input id="search" placeholder="筛选项目素材" aria-label="参考板搜索" />
    <p id="status">正在连接宿主…</p>
    <div id="assets" class="grid"></div>
    <script type="module">
      let context;
      const search = document.querySelector("#search");
      function render() {
        if (!context) return;
        const project = context.project;
        const page = project.workspace.pages.find(
          (n) => n.id === context.nodeId,
        );
        document.querySelector("#heading").textContent =
          page?.config.heading || "参考素材板";
        const results = project.assets.filter(
          (a) =>
            !a.archived &&
            a.name.toLowerCase().includes(search.value.toLowerCase()),
        );
        document.querySelector("#status").textContent =
          `${project.name} · ${results.length} 个素材 · Core 版本 ${project.revision}`;
        const grid = document.querySelector("#assets");
        grid.replaceChildren();
        for (const asset of results) {
          const card = document.createElement("article");
          card.className = "card";
          const title = document.createElement("h3");
          title.textContent = asset.name;
          const detail = document.createElement("small");
          detail.textContent = `${asset.mediaType} · ${asset.id.slice(0, 8)}`;
          card.append(title, detail);
          grid.append(card);
        }
      }
      window.addEventListener("message", (event) => {
        if (event.source !== parent) return;
        if (event.data?.type === "workstation.context") {
          context = event.data;
          render();
        }
      });
      search.addEventListener("input", render);
      parent.postMessage(
        { type: "workstation.request", id: "context", method: "context.get" },
        "*",
      );
    </script>
  </body>
</html>
